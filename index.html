<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Una carta para ti 💗</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="scene">

        <!-- Texto superior -->
        <div class="intro" id="intro">
            <p>Hay algo para ti...</p>
        </div>

        <!-- CONTENEDOR DEL SOBRE -->
        <div class="envelope-container" id="envelopeContainer">

            <!-- Carta que está dentro del sobre -->
            <div class="letter" id="letter">

                <!-- Contenido de la carta -->
                <div class="letter-content">

                    <!-- FLORES DIBUJADAS -->
                    <svg class="flowers" viewBox="0 0 300 130"
                         xmlns="http://www.w3.org/2000/svg">

                        <!-- Tulipán izquierdo -->
                        <path
                            class="stem"
                            d="M75 115 C72 90 74 60 80 35"
                        />

                        <path
                            class="leaf"
                            d="M74 82 C50 70 43 82 73 91"
                        />

                        <path
                            class="tulip"
                            d="M65 38
                               C62 23 67 13 76 23
                               C82 8 91 16 91 29
                               C99 15 106 28 99 42
                               C91 57 70 54 65 38Z"
                        />

                        <!-- Rosa central -->
                        <path
                            class="stem"
                            d="M150 115 C148 88 150 62 150 42"
                        />

                        <path
                            class="leaf"
                            d="M149 82 C122 67 115 82 148 91"
                        />

                        <path
                            class="leaf"
                            d="M151 72 C177 58 185 73 153 81"
                        />

                        <circle
                            class="rose"
                            cx="150"
                            cy="35"
                            r="23"
                        />

                        <path
                            class="rose-detail"
                            d="M135 35
                               C142 22 158 22 165 35
                               C157 30 145 30 135 35Z"
                        />

                        <path
                            class="rose-detail"
                            d="M138 42
                               C148 34 160 37 164 44"
                        />

                        <!-- Tulipán derecho -->
                        <path
                            class="stem"
                            d="M225 115 C225 88 223 61 220 36"
                        />

                        <path
                            class="leaf"
                            d="M224 85 C248 69 257 82 226 94"
                        />

                        <path
                            class="tulip"
                            d="M205 38
                               C202 22 209 13 216 24
                               C222 8 232 16 231 30
                               C241 17 247 29 241 42
                               C233 56 210 53 205 38Z"
                        />

                    </svg>

                    <!-- MENSAJE -->
                    <div class="message">

                        <!--
                            =====================================
                            ESCRIBE TU MENSAJE AQUÍ
                            =====================================
                        -->

                        <p>
                            Espero hoy tengas un dia muy bonito como tu, y
                            espero hacerlo un poquito mejor con este 
                            mensaje mio niña bonita.
                        </p>

                        <p>
                           Brille con esos ojitos lindos que tiene
                        </p>
                    

                    </div>

                    <div class="signature">
                        Att. AI
                    </div>

                </div>
            </div>


            <!-- PARTE TRASERA DEL SOBRE -->
            <div class="envelope-back"></div>

            <!-- PARTE FRONTAL DEL SOBRE -->
            <div class="envelope-front"></div>

            <!-- SOLAPA DEL SOBRE -->
            <div class="envelope-flap"></div>

            <!-- CORAZÓN -->
            <div class="heart" id="heart">
                ♥
            </div>

        </div>

        <!-- INSTRUCCIÓN -->
        <div class="instruction" id="instruction">
            Haz clic en el sobre
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
