<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fcecef">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%A5%3C/text%3E%3C/svg%3E">
  <title>Lindo día, Vianney ♡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" aria-label="Un saludo especial para Vianney">
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <p class="eyebrow" id="eyebrow">Un pequeño detalle para ti</p>

    <section class="heart-stage">
      <svg class="heart-art" viewBox="0 0 520 470" role="img" aria-label="Un corazón rosa dibujándose">
        <defs>
          <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f4b9c4"/>
            <stop offset="55%" stop-color="#e8a3ae"/>
            <stop offset="100%" stop-color="#c97987"/>
          </linearGradient>
          <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <path class="heart-shadow"
          d="M260 405 C224 371 78 271 78 158 C78 93 124 54 177 54 C218 54 246 78 260 111 C274 78 302 54 343 54 C396 54 442 93 442 158 C442 271 296 371 260 405 Z"/>
        <path class="heart-outline"
          d="M260 405 C224 371 78 271 78 158 C78 93 124 54 177 54 C218 54 246 78 260 111 C274 78 302 54 343 54 C396 54 442 93 442 158 C442 271 296 371 260 405 Z"/>
        <path class="heart-fill"
          d="M260 405 C224 371 78 271 78 158 C78 93 124 54 177 54 C218 54 246 78 260 111 C274 78 302 54 343 54 C396 54 442 93 442 158 C442 271 296 371 260 405 Z"/>
        <path class="shine" d="M116 147 C119 105 147 83 180 84"/>
        <path class="shine shine-small" d="M132 177 C135 162 141 151 151 144"/>
      </svg>

      <div class="greeting" id="greeting" aria-live="polite">
        <span class="greeting-line">Lindo día</span>
        <span class="greeting-name">Vianney</span>
        <span class="tiny-heart">♡</span>
      </div>
    </section>

    <p class="subtitle" id="subtitle">Que hoy te encuentre la alegría, y te acompañe todo el día.</p>

    <div class="petals" aria-hidden="true">
      <span>♡</span><span>✧</span><span>♡</span><span>✦</span><span>♡</span><span>✧</span>
    </div>
    <button class="replay" id="replay" type="button" aria-label="Repetir animación">↻ Ver de nuevo</button>
    <section class="songs" id="songs" aria-label="Canciones para ti" hidden></section>
    <p class="signature">Hecho con cariño <span>♥</span></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
